name: EdgeOne Makers 构建验证

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站点
        run: npm run build

      # 当前 Makers 项目由 GitHub Provider 管理，main 推送会由 Makers 自动部署。
      - name: 确认 Makers 自动部署
        run: echo "构建验证通过，EdgeOne Makers 将通过 GitHub Provider 发布 main 分支。"
